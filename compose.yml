---
services:
  xposter:
    image: ghcr.io/oszuidwest/zw-xposter:latest
    build: .
    container_name: xposter
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TMPDIR=/tmp/xposter
      - X_USERNAME
      - X_AUTH_TOKEN
      - X_USER_AGENT
      - FEED_URL
      - ALLOWED_HOSTS
      - POLL_INTERVAL
      - POST_DELAY
      - MAX_AGE
      - VIDEO_REPLACE_WINDOW
      - DRY_RUN
      - HEARTBEAT_URL
      - POSTER_NOT_READY_AFTER
      - POLL_STALE_AFTER
      - ALERT_REMINDER_INTERVAL
      - GRAPH_TENANT_ID
      - GRAPH_CLIENT_ID
      - GRAPH_CLIENT_SECRET
      - GRAPH_FROM_ADDRESS
      - ALERT_RECIPIENTS
      - ELEVENLABS_API_KEY
    volumes:
      - xposter-data:/data
    tmpfs:
      - /tmp/xposter:size=2g,uid=1000,gid=1000,mode=0700

volumes:
  xposter-data:
