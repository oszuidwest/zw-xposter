<!doctype html>
<meta charset="utf-8">
<title>Offline poster fixture</title>
<button data-testid="SideNav_AccountSwitcher_Button">Account</button>
<a data-testid="AppTabBar_Profile_Link" href="/fixture_account">Profile</a>
<button data-testid="SideNav_NewTweet_Button" onclick="document.querySelector('[role=dialog]').hidden=false">Compose</button>
<section role="dialog" aria-modal="true" hidden>
  <div data-testid="tweetTextarea_0" contenteditable="true" style="width:400px;height:80px;border:1px solid"></div>
  <input type="file" data-testid="fileInput">
  <div data-testid="attachments"></div>
  <button id="caption-open" hidden>Ondertitelbestand (.srt) uploaden</button>
  <button data-testid="tweetButton">Post</button>
</section>
<section id="captions" role="dialog" aria-modal="true" hidden>
  <input type="file" accept=".srt,text/plain," data-testid="fileInput">
  <button id="caption-remove" hidden>Bijschriften verwijderen</button>
  <button id="caption-done">Gereed</button>
</section>
<article>Offline timeline</article>
<script>
  let noticeShown = false;
  let captionFile;
  document.querySelector('[data-testid=fileInput]').onchange = async (event) => {
    const file = event.target.files[0];
    const preview = document.createElement(file.type === 'video/mp4' ? 'video' : 'img');
    preview.style.cssText = 'width:320px;height:180px';
    document.querySelector('[data-testid=attachments]').replaceChildren(preview);
    if (file.type !== 'video/mp4') return;
    document.querySelector('#caption-open').hidden = false;
    await fetch('/i/media/upload.json?command=INIT', { method: 'POST' });
    await fetch('/i/media/upload.json?command=APPEND', { method: 'POST', body: file });
    await fetch('/i/media/upload.json?command=FINALIZE', { method: 'POST' });
    await fetch('/i/media/upload.json?command=STATUS&media_id=123');
    // Like X, announce downloadable videos once, in a sheet that covers the composer.
    if (noticeShown) return;
    noticeShown = true;
    const notice = document.createElement('div');
    notice.setAttribute('role', 'dialog');
    notice.style.cssText = 'position:fixed;inset:0;background:#fffc';
    notice.innerHTML = '<button>Got it</button>';
    notice.querySelector('button').onclick = () => notice.remove();
    document.body.append(notice);
  };
  document.querySelector('#caption-open').onclick = () => {
    document.querySelector('section').hidden = true;
    document.querySelector('#captions').hidden = false;
  };
  document.querySelector('#captions input').onchange = async (event) => {
    captionFile = event.target.files[0];
    await globalThis.offlineCaptionSelected?.();
    document.querySelector('#caption-remove').hidden = false;
    // Selection changes the UI; X defers the network upload until Post.
    event.target.remove();
  };
  document.querySelector('#caption-done').onclick = () => {
    if (document.querySelector('#caption-remove').hidden) return;
    document.querySelector('#captions').hidden = true;
    document.querySelector('section').hidden = false;
    document.querySelector('#caption-open').textContent = 'Transcripties';
  };
  document.querySelector('[data-testid=tweetButton]').onclick = async () => {
    if (captionFile) {
      // Observed X behavior: only text/plain selects the subtitles category.
      const category = captionFile.type === 'text/plain' ? 'subtitles' : 'tweet_image';
      const init = await fetch(`/i/media/upload.json?command=INIT&media_category=${category}&media_type=${encodeURIComponent(captionFile.type)}`, { method: 'POST' });
      const { media_id_string: id } = await init.json();
      const append = await fetch(`/i/media/upload.json?command=APPEND&media_id=${id}`, { method: 'POST', body: captionFile });
      const finalize = append.ok && await fetch(`/i/media/upload.json?command=FINALIZE&media_id=${id}`, { method: 'POST' });
      const associated = finalize?.ok && await fetch('/i/api/1.1/media/subtitles/create.json', { method: 'POST', body: JSON.stringify({ media_id: '123', subtitle_id: id }) });
      if (!associated?.ok) {
        const error = document.createElement('p');
        error.setAttribute('role', 'alert');
        error.textContent = 'Een deel van je media kon niet worden geüpload.';
        document.querySelector('section').prepend(error);
        return;
      }
    }
    await fetch('/i/api/graphql/offline/CreateTweet', {
      method: 'POST',
      body: JSON.stringify({ text: document.querySelector('[contenteditable]').textContent }),
    });
    document.querySelector('[role=dialog]').remove();
  };
  const status = location.pathname.match(/^\/fixture_account\/status\/(\d+)$/);
  if (status) {
    const tweetID = status[1];
    const post = document.createElement('article');
    post.innerHTML = `<a href="/fixture_account/status/${tweetID}"><time>1 u</time></a> <button data-testid="caret">Meer</button>`;
    const menu = document.createElement('div');
    menu.setAttribute('role', 'menu');
    menu.hidden = true;
    menu.innerHTML = '<div role="menuitem" tabindex="0">Bladwijzer toevoegen</div><div role="menuitem" tabindex="0">Verwijderen</div>';
    const sheet = document.createElement('div');
    sheet.hidden = true;
    sheet.innerHTML = '<button data-testid="confirmationSheetConfirm">Verwijderen</button>';
    post.querySelector('[data-testid=caret]').onclick = () => { menu.hidden = false; };
    menu.lastChild.onclick = () => { menu.hidden = true; sheet.hidden = false; };
    sheet.firstChild.onclick = async () => {
      await fetch('/i/api/graphql/offline/DeleteTweet', { method: 'POST', body: JSON.stringify({ variables: { tweet_id: tweetID } }) }).catch(() => {});
      sheet.remove();
    };
    document.body.append(post, menu, sheet);
  }
  if (location.pathname === '/fixture_account') {
    (async () => {
      const response = await fetch('/i/api/graphql/offline/UserOriginalsTimeline?variables=%7B%7D');
      if (response.headers.get('x-offline-next')) {
        await fetch('/i/api/graphql/offline/UserOriginalsTimeline?variables=%7B%22cursor%22%3A%22next%22%7D');
      }
    })();
  }
</script>
