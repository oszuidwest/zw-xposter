---
# Requires .hadolint.yaml at the repo root.
name: Docker Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Docker Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Ignore rules live in .hadolint.yaml - do not duplicate here.
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              comments:
                min-spaces-from-content: 1
              truthy:
                allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
              document-start:
                present: true

      - name: Check container scripts
        run: shellcheck --severity=warning container/*.sh

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      # compose.yml only passes variables through, so nothing needs a .env.
      - name: Docker Compose Validation
        run: docker compose config --quiet
