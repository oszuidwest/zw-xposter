---
name: Docker Security

"on":
  push:
    branches: [main]
    # Documentation never reaches the image.
    paths-ignore: &docs
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.env.example'
  pull_request:
    paths-ignore: *docs
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Release tag to scan before publication
        type: string
        default: ''

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security scan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_REF: zw-xposter:security-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build a fresh image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          pull: true
          load: true
          tags: ${{ env.IMAGE_REF }}
          # Cached package-install layers would miss newly available security fixes.
          no-cache: true

      - name: Check the browser and container lifecycle without network access
        run: bash container/test.sh "$IMAGE_REF"

      - name: Generate security report
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Upload security report
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: zw-xposter-${{ matrix.arch }}

      # Report first so a failed gate still leaves evidence in the Security tab.
      - name: Block fixable high and critical vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln,secret
          ignore-unfixed: true
          exit-code: '1'
