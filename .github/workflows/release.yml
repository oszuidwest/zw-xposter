---
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (vX.Y.Z or vX.Y.Z-prerelease); creates the tag if missing'
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION="v${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must be vX.Y.Z or vX.Y.Z-prerelease and cannot be edge."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout selected commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Create release tag if missing
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/$VERSION")
          if [[ -n "$EXISTING_TAG" ]]; then
            echo "Tag $VERSION already exists; using it for this release."
            exit 0
          fi
          git tag "$VERSION" "$RELEASE_SHA"
          # GITHUB_TOKEN does not trigger another workflow on this tag push.
          git push origin "refs/tags/$VERSION"

  security:
    needs: version
    uses: ./.github/workflows/docker-security.yml
    with:
      ref: ${{ needs.version.outputs.value }}
    permissions:
      contents: read
      security-events: write

  publish:
    needs: [version, security]
    uses: oszuidwest/.github-templates/.github/workflows/docker-publish.yml@v3
    with:
      version: ${{ needs.version.outputs.value }}
      image-name: oszuidwest/zw-xposter
      dockerfile-path: Dockerfile
      image-labels: |
        org.opencontainers.image.title=ZuidWest X Poster
        org.opencontainers.image.description=Feed orchestrator and browser poster for ZuidWest
        org.opencontainers.image.vendor=Streekomroep ZuidWest
    permissions:
      contents: read
      packages: write

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Keeps a release created by hand, with its notes, when one already exists.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$VERSION" --verify-tag --title "${VERSION#v}" --generate-notes --prerelease
          else
            gh release create "$VERSION" --verify-tag --title "${VERSION#v}" --generate-notes --latest
          fi

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Each rebuilt multi-platform image leaves unreferenced manifests behind.
      - name: Delete orphaned images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: zw-xposter
          validate: true
