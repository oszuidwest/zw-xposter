---
name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'poster/**'
      - 'testdata/contract/**'
      - '.github/workflows/ci.yml'
  # Any base branch: stacked PRs target each other, not main.
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: oszuidwest/.github-templates/.github/workflows/go-ci.yml@v3

  node:
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: poster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26  # keep in step with the Dockerfile node image
          cache: npm
          cache-dependency-path: poster/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
